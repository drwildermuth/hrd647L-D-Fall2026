.inp.area { min-height: 5em; } .inp.big { min-height: 9em; } .inp.line { min-height: 2.6em; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.pn { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }

@media (max-width: 860px) {

  body.navopen .side { transform: none; box-shadow: 0 0 30px rgba(0,0,0,.35); }

  .topbar { display: flex; align-items: center; gap: 12px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
  h1 { font-size: 27px; } .keyrow, .cmp { grid-template-columns: 1fr; gap: 4px; }

<script>
/* Notes collection and export. Pure functions: easy to test in node. */
function collectNotes(CONTENT, data) {
  var out = [];
  function val(k) { var v = data[k]; return typeof v === 'string' ? v.trim() : v; }
  function tableHas(rows) { return (rows || []).some(function (r) { return r.some(function (c) { return (c || '').trim(); }); }); }
  CONTENT.phases.forEach(function (ph) {
    ph.steps.forEach(function (st) {
      var items = [];
      st.blocks.forEach(function (b) {
        (b.fields || []).forEach(function (f) { var v = val(f.key); if (v) items.push({ label: f.label, text: v }); });
        if (b.table) {
          var rows = data[b.table.key];
          if (tableHas(rows)) items.push({ label: b.table.label || '', table: { cols: b.table.cols, rows: rows } });
        }
      });
      var done = !!data[st.doneKey];
      if (items.length || done) out.push({ heading: st.title, done: done, items: items });
    });
  });
  var log = data[CONTENT.aiLog.key];
  if (tableHas(log)) out.push({ heading: CONTENT.aiLog.title, done: false, items: [{ label: '', table: { cols: CONTENT.aiLog.cols, rows: log } }] });
  return out;
}

function notesToText(title, notes) {
  var L = [title, ''];
  notes.forEach(function (s) {
    L.push(s.heading + (s.done ? '  [marked done]' : ''));
    L.push('');
    s.items.forEach(function (it) {
      if (it.table) {
        if (it.label) L.push(it.label);
        L.push(it.table.cols.join(' | '));
        it.table.rows.forEach(function (r) { if (r.some(function (c) { return (c || '').trim(); })) L.push(r.map(function (c) { return (c || '').replace(/\n/g, ' '); }).join(' | ')); });
      } else { L.push(it.label); L.push(it.text); }
      L.push('');
    });
  });
  return L.join('\n');
}

function buildDocx(lib, title, notes) {
  var Document = lib.Document, Paragraph = lib.Paragraph, TextRun = lib.TextRun, Table = lib.Table, TableRow = lib.TableRow,
      TableCell = lib.TableCell, WidthType = lib.WidthType, ShadingType = lib.ShadingType, HeadingLevel = lib.HeadingLevel;
  var kids = [];
  var F = 'Calibri';
  kids.push(new Paragraph({ children: [new TextRun({ text: title, bold: true, size: 32, color: '980000', font: F })], spacing: { after: 240 } }));
  notes.forEach(function (s) {
    kids.push(new Paragraph({ heading: HeadingLevel.HEADING_2, spacing: { before: 280, after: 120 },
      children: [new TextRun({ text: s.heading, bold: true, italics: true, size: 24, color: '073763', font: F })] }));
    if (s.done) kids.push(new Paragraph({ spacing: { after: 100 }, children: [new TextRun({ text: 'Marked done', size: 20, color: '595959', font: F })] }));
    s.items.forEach(function (it) {
      if (it.table) {
        if (it.label) kids.push(new Paragraph({ spacing: { before: 100, after: 60 }, children: [new TextRun({ text: it.label, bold: true, size: 22, font: F })] }));
        var ncol = it.table.cols.length, w = Math.floor(9360 / ncol);
        var head = new TableRow({ tableHeader: true, children: it.table.cols.map(function (c) {
          return new TableCell({ width: { size: w, type: WidthType.DXA }, shading: { type: ShadingType.CLEAR, color: 'auto', fill: '073763' },
            children: [new Paragraph({ children: [new TextRun({ text: c, bold: true, size: 20, color: 'FFFFFF', font: F })] })] });
        }) });
        var rows = it.table.rows.filter(function (r) { return r.some(function (c) { return (c || '').trim(); }); }).map(function (r) {
          return new TableRow({ children: it.table.cols.map(function (_, i) {
            return new TableCell({ width: { size: w, type: WidthType.DXA },
              children: String(r[i] || '').split('\n').map(function (ln) { return new Paragraph({ children: [new TextRun({ text: ln, size: 20, font: F })] }); }) });
          }) });
        });
        kids.push(new Table({ width: { size: 9360, type: WidthType.DXA }, rows: [head].concat(rows) }));
        kids.push(new Paragraph({ spacing: { after: 120 }, children: [] }));
      } else {
        kids.push(new Paragraph({ spacing: { before: 100, after: 40 }, children: [new TextRun({ text: it.label, bold: true, size: 22, color: '980000', font: F })] }));
        String(it.text).split('\n').forEach(function (ln) {
          kids.push(new Paragraph({ spacing: { after: 60 }, children: [new TextRun({ text: ln, size: 22, font: F })] }));
        });
      }
    });
  });
  return new Document({ sections: [{ properties: {}, children: kids }] });
}
if (typeof module !== 'undefined') module.exports = { collectNotes: collectNotes, notesToText: notesToText, buildDocx: buildDocx };

var CONTENT = /*CONTENT*/{"title": "Working With a Client Under Time Pressure: A Guided Exploration", "intro": "This is a guide to help you get started. You do not need to submit anything yet.", "paras": ["Real clients are busy, give you information in pieces, and sometimes answer a different question than the one you asked. You will rarely have everything you want before you have to start. In fact, this is why “real-life” practitioners often criticize the ADDIE model — it’s too rigid, assuming each step smoothly leads to the next. ", "This guide shows you how to use AI to move faster without letting it do your thinking. The rule is simple: AI organizes and proposes; you check and decide."], "note": "A note here: This is not about “not wanting you to use AI.” Learning & development professionals use AI quite a bit these days. It’s about doing what we often call in the field “keeping the leader in the loop” — ensuring that you, the human, are firmly in charge. Also, from personal experience: AI-generated courses tend to be pretty, well-written, but… they seldom (unless you work quite a bit on prompting, changing, challenging, etc.) follow Merrill’s Principles of Learning. Instead, they are more likely to fit the “teach and quiz” variety. In particular, AI-generated scenarios can have one serious fault: They are too obvious. The “right” answer is smooth, precise, and often detailed. The “wrong” answer is so obviously wrong that the exercise is unlikely to lead to learning. ", "howto": "There are ten steps in four phases: Understand, Decide, Generate, and Build. Every step uses the same five signs, so you always know who is doing what.", "key": [{"icon": "pencil", "label": "Your turn", "text": "The part only you can do."}, {"icon": "msg", "label": "Ask your AI", "text": "A prompt to copy into your AI tool. Parts in [brackets] fill in from what you have already written."}, {"icon": "search", "label": "Check it", "text": "How to make sure the result is right."}, {"icon": "done", "label": "Done when", "text": "What you should have before you move on."}, {"icon": "warn", "label": "Watch out", "text": "A rule or risk to keep in mind."}], "howtoNote": ["Work in one AI chat for Steps 2 to 9, so the AI already has your documents and your earlier answers. If you start a new chat, paste in the summary you saved in Step 2 first.", "You are not expected to write the scenario yourself. The AI drafts it. You judge it, find what is not right, and direct the changes. Where you do not know the industry, check with sources and the client.", "Steps 4, 5, and 6 happen together in real life. Keep a running list as you go and keep moving. You do not need to wait until you have everything.", "Keep your AI and Tools Log as you work: the tool, the task, the prompt, what you changed, and whether you would use it at work. It doubles as your AI disclosure."], "aiLog": {"key": "ai_log", "title": "AI and Tools Log", "sub": "Keep this as you work. It doubles as your AI disclosure.", "cols": ["Tool", "Task", "Prompt", "What I changed", "Would I use it at work?"]}, "closing": "Your running list becomes the questions you send the client. Your problem, what should change, and your objectives go straight into your project proposal.", "bloom": [["Remember", ["list", "name", "recall", "identify", "state"]], ["Understand", ["explain", "summarize", "describe", "classify", "paraphrase"]], ["Apply", ["use", "carry out", "demonstrate", "perform", "apply"]], ["Analyze", ["compare", "distinguish", "diagnose", "examine", "differentiate"]], ["Evaluate", ["judge", "justify", "prioritize", "critique", "defend"]], ["Create", ["design", "draft", "propose", "construct", "develop"]]], "phases": [{"name": "Understand", "steps": [{"title": "Step 1. Gather what you have, and look for what the client did not tell you", "doneKey": "s1_done", "purpose": "Get everything in one place before you ask an AI anything, and find what the client never mentioned.", "blocks": [{"t": "turn", "text": "Start with two short answers. They fill in the prompt in Step 2.", "fields": [{"key": "s1_audience", "label": "Who is the course for? (for example, service managers at a material handling company)", "kind": "line"}, {"key": "s1_topic", "label": "What is it about? (for example, workplace safety)", "kind": "line"}]}, {"t": "turn", "text": "Collect everything the client has given you: briefings, emails, call or class transcripts, answers to your questions, and their website. If you are working on your own project, use your own materials. If you are working on the client identified for this class, use the materials your instructor shared in the course, such as the draft briefing, answers to questions, class transcripts, and email threads.", "fields": [{"key": "s1_inventory", "label": "What I have from the client (a list of the documents)", "kind": "area"}]}, {"t": "callout", "tone": "blue", "paras": [{"text": "Note to students not working on the general class project: I am assuming from the prompts planned that you have information received from the client. If you don’t, stop, and gather at least preliminary information such as the client’s purpose with the training, the audience, the problem they are trying to solve, and examples of situations in which the problem is in evidence. Without at least minimum information from a real client, you can’t create a course that is likely to be helpful."}]}, {"t": "turn", "text": "Investigate on your own. Look at the client’s website, their industry, the rules and standards that apply to them, and recent news. If it is out there, find it yourself instead of asking the client. Save the link for everything you use.", "fields": [{"key": "s1_links", "label": "Websites and public sources I found (one link per line, with a few words on what each is)", "kind": "area"}, {"key": "s1_research", "label": "My own notes from this research", "kind": "area"}]}, {"t": "turn", "text": "As you investigate, you may find prompts you want to try. Save them here. Do not run them yet. Step 2 comes first.", "fields": [{"key": "s1_later", "label": "Prompts I want to try later", "kind": "area"}]}, {"t": "watch", "paras": [{"lead": "Public information:", "text": "It helps you understand the client. It does not go into the course unless the client asks for it. If you find lawsuits, citations, or news about incidents, knowing about them does not mean building a scenario around them. A scenario that revisits a real incident could embarrass the client."}, {"lead": "Confidential documents:", "text": "Before you paste anything into an AI tool, make sure you are allowed to. If you are not sure, ask the client first. Do not paste anything marked confidential."}]}, {"t": "done", "text": "you have every client document in one place, plus a list of links for what you found yourself."}]}, {"title": "Step 2. Ask AI to organize it (not to write anything)", "doneKey": "s2_done", "purpose": "Have the AI sort the pile so you can see it. It organizes. It does not write.", "blocks": [{"t": "ai", "intro": "Attach your documents to your AI chat, then paste this prompt. It is built from what you entered in Step 1. If a [bracket] is still red, go back and fill it in, or delete that line.", "heading": "Paste this into your AI", "prompt": "I am designing a short training course for [audience] about [topic]. Below are the documents and links I have from the client and from my own research. Organize them. Do not write any scenarios, objectives, or training content, and do not give recommendations.\n\nUse only the documents I attached or pasted and the links below. For each link, tell me whether you were able to open it. Do not treat anything you could not read as read. Names in transcripts may be misspelled.\n\nGive me your answer in two parts.\n\nPART 1: SUMMARY (it must fit on one screen)\nA table with one row per key fact and these columns: What it says (one line) | Who said it (Client / Public source / Me) | Source (the file or link name, plus a short exact quote of 15 words or fewer that I can find with Ctrl-F) | Status (Clear / Conflict / Unanswered / Check).\nUnder the table, add four to six lines: what we know, where the sources conflict, and what is still missing.\n\nPART 2: DETAILS\nSections by topic: the audience and the problem; what the client expects people to do; tools, policies, and processes already in place; risks the client mentioned; open questions. Each point gets its source and a short quote. Describe only what the sources say. No interpretation, conclusions, assessments, or advice.\n\nRules:\n- Facts from the client and facts from public sources stay separate. Never present a public source as something the client said.\n- Court cases, lawsuits, and news about incidents go in a short section called BACKGROUND ONLY. Say what each document is, and do not summarize the facts of the case.\n- If you are not sure a source says something, put it under Check. Do not guess.\n- Stop after Part 2 and wait for my next instruction.\n\nWHAT I HAVE FROM THE CLIENT: [what I have]\nLINKS I FOUND (public sources): [links]\nMY OWN NOTES FROM RESEARCH (from me, not from the client): [notes]", "fills": [{"token": "[audience]", "keys": ["s1_audience"]}, {"token": "[topic]", "keys": ["s1_topic"]}, {"token": "[what I have]", "keys": ["s1_inventory"], "drop": true}, {"token": "[links]", "keys": ["s1_links"], "drop": true, "block": true}, {"token": "[notes]", "keys": ["s1_research"], "drop": true}]}, {"t": "plain", "text": "You get a summary first, then the details. Read the summary first. Use the details to look things up. Stay in this chat for the next steps."}, {"t": "saved", "key": "s1_later", "heading": "Your saved prompts", "intro": "Use these only after you have checked the summary in Step 3."}, {"t": "turn", "text": "Paste the AI’s summary here, so you can find it later. Add the details too if you want them in your notes.", "fields": [{"key": "s2_lists", "label": "The AI’s summary", "kind": "big"}]}, {"t": "watch", "paras": [{"text": "If the AI gives you a long report instead of a summary and a table, paste the prompt again and tell it: “Follow the two-part format exactly.”"}]}, {"t": "done", "text": "you have the AI’s summary table and details. Log the prompt in your AI and Tools Log."}]}, {"title": "Step 3. Read it carefully, and check it", "doneKey": "s3_done", "purpose": "Make sure the AI’s version matches the originals.", "blocks": [{"t": "plain", "text": "An AI summary is a starting point, not a source. Your course has to rest on information you found, checked, and chose yourself."}, {"t": "turn", "text": "Pick at least three rows from the summary and find them in the original documents. Record what you find:", "table": {"key": "s3_table", "label": "Spot checks", "cols": ["Item from the AI’s summary", "Where I found it in the original", "Did it match?", "Use / Check / Ignore"], "rows": 3}}, {"t": "turn", "text": "Then write a line or two for yourself:", "fields": [{"key": "s3_a", "label": "What surprised me?", "kind": "area"}, {"key": "s3_b", "label": "Where did the sources disagree, and who might know the answer?", "kind": "area"}, {"key": "s3_c", "label": "What is the client still missing or leaving vague, and does it block me, or can I assume something and move on?", "kind": "area"}]}, {"t": "check", "text": "Use Find (Ctrl-F) to confirm that any quote the AI gave you is really in the original. Check anything you plan to use in the course, not only three items."}, {"t": "done", "text": "you have items marked Use, Check, or Ignore, and a few lines about what surprised you."}]}]}, {"name": "Decide", "steps": [{"title": "Step 4. Decide what you conclude, and keep a running list", "doneKey": "s4_done", "purpose": "Say what the problem is and what should change, and write down what you still need.", "blocks": [{"t": "turn", "text": "Start with what you think is getting in the way. Is it that people cannot do it, will not do it, are not sure they are allowed to, or do not have the time? This decides what kind of training, if any, will help.", "fields": [{"key": "s4_cause", "label": "What I think is getting in the way, and how I know", "kind": "area"}]}, {"t": "turn", "text": "Write the problem in one sentence: what is going wrong now, in the client’s world? Use the client’s words, not the AI’s. For example: “[Who] currently [does or does not do what], which leads to [consequence].”", "fields": [{"key": "s4_problem", "label": "The problem in one sentence", "kind": "area"}]}, {"t": "turn", "text": "Now write what should change: after this course, what should the learners do differently? For example: “After this course, [who] will [do what] when [situation].”", "fields": [{"key": "s4_change", "label": "What should change", "kind": "area"}]}, {"t": "turn", "anchor": "runninglist", "text": "Start a running list with three columns. Add to it through Steps 4, 5, and 6. You do not need to stop until it is complete.", "table": {"key": "running_list", "label": "Running list", "cols": ["Ask the client", "Investigate online", "Assume for now (my default)"], "rows": 3}}, {"t": "callout", "tone": "gray", "paras": [{"lead": "Deciding which column:", "text": "If a different answer would force you to rebuild, ask the client first. If it would only change a line, assume it, mark it, and keep going."}, {"lead": "If you have your own client:", "text": "Send one batch, not a stream of emails. Keep each question short and specific. Add your default to each one: “Unless I hear otherwise, I will assume…”. Tell the client when you will go ahead with your assumptions, because clients cannot plan around a schedule they do not know."}, {"lead": "If you are working on the class client:", "text": "Do not contact the client. Add your questions, each with your default, to the question document your instructor sets up. Your instructor will tell you where to submit them, will combine them, and will send them on when it makes sense. Until an answer comes back, keep working on your default assumptions and mark them, so you are never waiting. The date to go ahead is the one your instructor gives you."}]}, {"t": "done", "text": "you have a problem, a statement of what should change, and a running list."}]}, {"title": "Step 5. Write tentative learning objectives", "doneKey": "s5_done", "purpose": "Decide what learners must be able to do. This step is yours.", "blocks": [{"t": "turn", "text": "Write your own draft objectives. Write no more than three, and fewer is fine, because this is a short course. Each objective says what the learner will be able to do, in a situation from the client’s world, using a verb you could actually observe. They are tentative and will change as you learn more.", "fields": [{"key": "s5_o1", "label": "Objective 1", "kind": "line"}, {"key": "s5_o2", "label": "Objective 2", "kind": "line"}, {"key": "s5_o3", "label": "Objective 3", "kind": "line"}]}, {"t": "objmaker", "key": "s5_maker", "targets": ["s5_o1", "s5_o2", "s5_o3"]}, {"t": "ai", "intro": "Do not ask the AI to write your objectives. Ask it to critique yours.", "heading": "Paste this into your AI", "prompt": "Below is the problem a client wants a short training course to solve, what should change after the course, and my draft learning objectives. Do not rewrite my objectives and do not write new ones. Critique only.\n\nFor each objective, answer these five questions in a table:\n1. Is it observable? What would I see someone doing?\n2. Is it too big for a short course?\n3. Does it connect to the problem and to what should change?\n4. What does it assume? (For example, about authority, time, or tools.)\n5. How could I test that assumption, and what question would I ask the client?\n\nThen ask me up to three questions that would help me sharpen the objectives.\n\nPROBLEM: [problem]\n\nWHAT SHOULD CHANGE: [change]\n\nMY OBJECTIVES:\n[paste]", "fills": [{"token": "[problem]", "keys": ["s4_problem"]}, {"token": "[change]", "keys": ["s4_change"]}, {"token": "[paste]", "keys": ["s5_o1", "s5_o2", "s5_o3"], "join": "\n"}]}, {"t": "turn", "text": "Note what the AI pointed out. Send its questions and assumptions to your running list.", "fields": [{"key": "s5_ai", "label": "What the AI pointed out", "kind": "area"}]}, {"t": "toList", "key": "s5_q", "label": "A question or assumption to add to my running list", "button": "Add to my running list"}, {"t": "turn", "text": "Now revise your objectives in your own words. The prompts from here on use these.", "fields": [{"key": "s5_changed", "label": "What I changed, and why", "kind": "area"}, {"key": "s5_r1", "label": "Revised objective 1", "kind": "line"}, {"key": "s5_r2", "label": "Revised objective 2", "kind": "line"}, {"key": "s5_r3", "label": "Revised objective 3", "kind": "line"}]}, {"t": "ai", "intro": "Only after you have written your own revised objectives, ask the AI for suggestions. You decide what to keep.", "heading": "Paste this into your AI", "prompt": "Using only what is in this conversation, suggest up to three additional learning objectives I may have missed. For each one, name the fact it rests on (with its source). Do not rewrite my objectives. I will decide whether to keep, change, or drop each suggestion.\n\nPROBLEM: [problem]\n\nWHAT SHOULD CHANGE: [change]\n\nMY OBJECTIVES:\n[paste]", "fills": [{"token": "[problem]", "keys": ["s4_problem"]}, {"token": "[change]", "keys": ["s4_change"]}, {"token": "[paste]", "groups": [["s5_r1", "s5_r2", "s5_r3"], ["s5_o1", "s5_o2", "s5_o3"]], "join": "\n"}]}, {"t": "turn", "text": "For each suggestion: keep, change, or drop, and why.", "fields": [{"key": "s5_sug", "label": "The AI’s suggestions, and my decision on each", "kind": "big"}]}, {"t": "check", "text": "Can you trace each objective to something the client said? Could you watch someone do it?"}, {"t": "done", "text": "you have one to three objectives, and a note on what you changed after the AI’s feedback."}]}]}, {"name": "Generate", "steps": [{"title": "Step 6. Ask the AI for scenario ideas (not full scenarios)", "doneKey": "s6_done", "purpose": "Get a range of episodes to choose from. Ideas only, no details yet.", "blocks": [{"t": "plain", "text": "An episode is a moment when someone must make a decision."}, {"t": "turn", "text": "", "fields": [{"key": "s6_role", "label": "Who is the person making the decision? (their job and setting)", "kind": "line"}]}, {"t": "ai", "intro": "Stay in the same chat. If you opened a new one, paste in your Step 2 summary first.", "heading": "Paste this into your AI", "prompt": "Using only the information already in this conversation (the documents, my notes, and the summary you produced) and my learning objectives below, propose six different episodes for a workplace scenario for [role].\n\nEach episode should be two or three sentences and describe a moment when this person must make a decision. For each one, tell me: (a) which learning objective it serves, (b) which fact from the information it is based on, and (c) the two reasonable pressures pulling in different directions.\n\nDo not give answer choices. Do not say what the right action is. Do not invent facts that are not in the information. Make the six different from each other in setting and in the kind of pressure.\n\nLEARNING OBJECTIVES:\n[paste]", "fills": [{"token": "[role]", "keys": ["s6_role"]}, {"token": "[paste]", "groups": [["s5_r1", "s5_r2", "s5_r3"], ["s5_o1", "s5_o2", "s5_o3"]], "join": "\n"}]}, {"t": "watch", "paras": [{"text": "Build episodes from your notes, not from real incidents you found online, unless the client asked you to use them."}]}, {"t": "turn", "text": "", "fields": [{"key": "s6_episodes", "label": "Paste the AI’s six episodes here", "kind": "big"}]}, {"t": "check", "text": "Read the AI’s note about its evidence, if it gives one. If the AI invented a fact, tell it and ask for a corrected list. Add anything it says it does not know to your running list."}, {"t": "done", "text": "you have six episodes, each with an objective, a client fact, and two pressures."}]}, {"title": "Step 7. Review the episodes and select one", "doneKey": "s7_done", "purpose": "Use what you know about the client to pick the episode worth building.", "blocks": [{"t": "turn", "text": "Rank the six episodes from best to worst. Go with your judgment and what you know about the client. Use the list below to spot weak ones.", "table": {"key": "s7_rank", "label": "My ranking", "cols": ["Episode (a few words)", "Rank (1 = best)", "Why, in a line"], "rows": 6, "ranks": {"1": 6}, "sortBy": 1}}, {"t": "list", "title": "How to spot a weak episode", "items": ["Nothing is at stake. The right choice costs nothing.", "It could happen at any company. Nothing in it comes from what your client told you.", "You cannot point to the fact it rests on.", "The “wrong” action has no defender. No reasonable person would take it.", "One of the two pressures is weak, so it is not a real dilemma."]}, {"t": "compare", "title": "Obvious versus better (a different industry, as an example)", "left": "Obvious: A nurse sees a coworker skip a hand-washing step. What should she do?", "right": "Better: It is 6:50 a.m. and Priya, a unit manager, is covering a short-staffed shift. A respected senior nurse, who has trained half the unit, skips a required step to save time before the 7 a.m. handoff. Nothing has gone wrong in years. Priya has about ninety seconds before the handoff starts.", "why": "The second one has a person who matters, a clock, and a cost to doing the right thing. A good manager could reasonably go either way, and that is what makes it worth discussing."}, {"t": "turn", "text": "Test your top-ranked episode. The most important question is the third. Write the strongest argument you can for the action you think is wrong. If you cannot make a good argument, the episode is too obvious. Move on to your second choice.", "fields": [{"key": "s7_t_fact", "label": "Which client fact is it built on?", "kind": "area"}, {"key": "s7_t_obj", "label": "Which objective does it serve?", "kind": "area"}, {"key": "s7_t_arg", "label": "The strongest argument for the “wrong” action", "kind": "area"}, {"key": "s7_t_second", "label": "Could it lead to a second decision? What?", "kind": "area"}]}, {"t": "plain", "text": "If none of the six work, tell the AI what is wrong with them and ask for six more."}, {"t": "turn", "text": "", "fields": [{"key": "s7_chosen", "label": "The episode I chose (paste it, with its objective, source fact, and two pressures)", "kind": "area"}, {"key": "s7_why", "label": "What will this scenario accomplish? (What should a learner understand or be able to do afterward?)", "kind": "area"}]}, {"t": "done", "text": "you have one chosen episode, and a sentence on what it will accomplish."}]}, {"title": "Step 8. Ask the AI to build out the scenario", "doneKey": "s8_done", "purpose": "Turn the chosen episode into a full scenario, with rules that keep it from being obvious.", "blocks": [{"t": "ai", "intro": "Left alone, AI writes scenarios that are smooth and obvious. This prompt tells it what to avoid. Stay in the same chat. If you opened a new one, paste in your Step 2 summary first.", "heading": "Paste this into your AI", "prompt": "Take the episode I chose and build it into a scenario with two decision points. Use only what is already in this conversation.\n\nEPISODE I CHOSE:\n[paste the episode, with its objective, source fact, and two pressures]\n\nWHAT THE SCENARIO SHOULD ACCOMPLISH: [what you wrote in Step 7]\n\nFor each decision point, give three or four options. Follow these rules:\n- Every option is something a competent, well-meaning person might really do, and each has a believable reason behind it.\n- The best option has a real cost. Doing the right thing should not be free.\n- Do not label any option as best, and put the options in an order that does not favor any of them.\n- Keep the options about the same length and tone.\n- No villain, and no option that is obviously foolish.\n- The situation, not the options, should carry the uncertainty. Do not tell the learner whether a violation is occurring.\n- After each option, describe what happens next as concrete facts (time, cost, a person's reaction) without signaling whether the choice was good or bad.\n- Use only facts from the information in this conversation. If you invent a fact about the company (a policy, a system, a number, a job title), mark it [INVENTED]. Ordinary story details, such as a first name or the time of day, do not need the mark.\n\nStart the scenario with a section called SETTING. In a few sentences, describe the physical place: what kind of space it is, what equipment and tools are there, who is there, and what they wear. Use only what the information says. If it does not describe the environment, do not guess. Mark each invented detail [INVENTED] and list under SETTING QUESTIONS what I should check with the client.\n\nEnd the scenario with a section called DEBRIEF: what each kind of choice costs and what it protects, in a few sentences. Do not name a single right answer unless the information supports one.\n\nAfter each decision point, add one line called IMAGE NOTE: what a photo or illustration of that moment should show, and what it must not show (no logos, no brand names, no readable signs, no real people).", "fills": [{"token": "[paste the episode, with its objective, source fact, and two pressures]", "keys": ["s7_chosen"]}, {"token": "[what you wrote in Step 7]", "keys": ["s7_why"]}]}, {"t": "turn", "text": "", "fields": [{"key": "s8_draft", "label": "Paste the AI’s first full draft here", "kind": "big"}]}, {"t": "check", "text": "Find every [INVENTED] marker. Replace it with a fact you can source, or keep it on purpose and add it to your running list as an assumption. Read the SETTING section closely. Does it describe the real place, or a generic one? Anything under SETTING QUESTIONS goes on your running list."}, {"t": "done", "text": "y ion to add to my running list", "button": "Add to my running list"}, {"t": "turn", "text": "Decide what to change. You do not need to rewrite the scenario yourself, and you may not know this industry well enough to. Write down what is wrong and what you want different, as specific instructions. For example: “Option B is too polite, give it a real cost,” or “Make the second decision depend on what happened in the first.” If you know how to fix a line, say exactly how. Do not ask the AI to fix things you have not checked.", "fields": [{"key": "s9_changed", "label": "What I want changed (specific instructions)", "kind": "area"}, {"key": "s9_kept", "label": "What I decided not to change, and why", "kind": "area"}]}, {"t": "ai", "intro": "In the chat where you built the scenario (Step 8), ask the AI to make only your changes.", "heading": "Paste this into your AI (same chat)", "prompt": "Revise the scenario with only the changes listed below. Change nothing else. Keep every other word as it is, and keep the [INVENTED] markers on invented company facts. If a change would require a fact you do not have, do not make one up. Mark it [INVENTED] and tell me what I need to check.\n\nCHANGES TO MAKE:\n[paste]", "fills": [{"token": "[paste]", "keys": ["s9_changed"]}]}, {"t": "turn", "text": "", "fields": [{"key": "s9_final", "label": "Paste the revised scenario here", "kind": "big"}]}, {"t": "check", "text": "Compare the revision with the draft. Did the AI make only the changes you asked for? Did anything new slip in? Any new company fact must be sourced or marked [INVENTED] and added to your running list."}, {"t": "turn", "text": "Now run a cold test. First write down which option you intended to be best at each decision point.", "fields": [{"key": "s9_intended", "label": "The option I intended to be best, for each decision point", "kind": "area"}]}, {"t": "ai", "intro": "In the chat where you built the revised scenario, paste this to get a test version.", "heading": "Paste this     var sentenceEl = el('div', 'sentence');
    function sentence() {
      var who = (st.who || '').trim() || (data.s1_audience || '').trim() || '[who]';
      return 'After this course, ' + who + ' will be able to ' + (st.verb || '[verb]') + ' ' + ((st.task || '').trim() || '[what they will do]') + ((st.cond || '').trim() ? ' ' + st.cond.trim() : '') + '.';
    }
    function build() {
      while (body.children.length > 1) body.removeChild(body.lastChild);
      body.appendChild(btnRow('1. Which objective is this for?', ['1', '2', '3'], String(st.target), function (v) { st.target = parseInt(v, 10); save(); }));
      body.appendChild(input('mk_who', '2. Who? (the learners)', 'who', data.s1_audience || ''));
      var levels = CONTENT.bloom.map(function (x) { return x[0]; });
      body.appendChild(btnRow('3. Level of thinking', levels, st.level, function (v) { st.level = v; st.verb = ''; save(); }));
      if (st.level) {
        var verbs = CONTENT.bloom.filter(function (x) { return x[0] === st.level; })[0][1];
        body.appendChild(btnRow('4. Verb', verbs, st.verb, function (v) { st.verb = v; save(); }));
      }
      body.appendChild(input('mk_task', '5. What will they do? (leave out the verb)', 'task', 'for example, a lift that breaks the policy from one that is unclear'));
      body.appendChild(input('mk_cond', '6. Under what conditions?', 'cond', 'for example, when a customer is waiting'));
      body.appendChild(el('div', 'flabel', 'Your objective'));
      sentenceEl.textContent = sentence(); body.appendChild(sentenceEl);
      var put = el('button', 'btn small', 'Put this in Objective ' + st.target); put.type = 'button';
      var msg = el('span', 'copynote'); msg.setAttribute('role', 'status');
      put.addEventListener('click', function () {
        var key = b.targets[st.target - 1]; data[key] = sentence(); persist();
        fieldEls.forEach(function (fe) { if (fe.key === key) { fe.t.value = data[key]; grow(fe.t); } });
        refreshPrompts(); msg.textContent = 'Done. You can still edit it in the box above.';
      });
      var row = el('div', 'actions'); row.appendChild(put); row.appendChild(msg); body.appendChild(row);
    }
    build();
    return d;
  }

  /* ---------- blocks ---------- */
  function paras(list, parent) {
    list.forEach(function (p) {
      var d = el('p', 'para');
      if (p.lead) d.appendChild(el('strong', null, p.lead + ' '));
      d.appendChild(document.createTextNode(p.text)); parent.appendChild(d);
    });
  }
  function block(b, step) {
    var s = el('section', 'blk blk-' + b.t);
    if (b.anchor) s.id = b.anchor;
    switch (b.t) {
      case 'turn':
        s.appendChild(label('turn'));
        if (b.text) s.appendChild(el('p', 'para', b.text));
        (b.fields || []).forEach(function (f) { s.appendChild(field(f)); });
        if (b.table) s.appendChild(table(b.table));
        break;
      case 'ai':
        s.appendChild(label('ai'));
        if (b.intro) s.appendChild(el('p', 'para', b.intro));
        s.appendChild(promptBox(b));
        break;
      case 'check': s.appendChild(label('check')); s.appendChild(el('p', 'para', b.text)); break;
      case 'watch': s.appendChild(label('watch')); paras(b.paras, s); break;
      case 'done':
        s.appendChild(label('done')); s.appendChild(el('p', 'para', cap(b.text)));
        var cb = el('label', 'donecheck'); var inp = document.createElement('input'); inp.type = 'checkbox'; inp.id = 'chk_' + step.doneKey;
        inp.checked = !!data[step.doneKey];
        inp.addEventListener('change', function () { data[step.doneKey] = inp.checked; persist(); updateNav(); });
        cb.appendChild(inp); cb.appendChild(el('span', null, 'Mark this step done')); s.appendChild(cb);
        break;
      case 'saved':
        s.appendChild(label('ai')); s.appendChild(el('p', 'para', b.intro));
        s.appendChild(promptBox({ heading: b.heading, prompt: '[saved]', fills: [{ token: '[saved]', keys: [b.key] }] }));
        (function () { function vis() { s.hidden = !(data[b.key] || '').trim(); } vis(); updaters.push(vis); })();
        break;
      case 'toList':
        (function () {
          var w = el('div', 'field');
          var l = el('label', 'flabel', b.label); l.setAttribute('for', 'f_' + b.key); w.appendChild(l);
          var t = el('textarea', 'inp area'); t.id = 'f_' + b.key; t.rows = 2; t.value = data[b.key] || '';
          t.addEventListener('input', function () { data[b.key] = t.value; grow(t); persist(); });
          var row = el('div', 'actions'); var btn = el('button', 'btn small', b.button); btn.type = 'button';
          var msg = el('span', 'copynote'); msg.setAttribute('role', 'status');
          btn.addEventListener('click', function () {
            var v = t.value.trim(); if (!v) { msg.textContent = 'Type something first.'; return; }
            var rows = data.running_list;
            if (!rows) { rows = data.running_list = [['', '', ''], ['', '', ''], ['', '', '']]; }
            var spot = null; for (var i = 0; i < rows.length; i++) { if (!(rows[i][0] || '').trim()) { spot = rows[i]; break; } }
            if (!spot) { spot = ['', '', '']; rows.push(spot); }
            spot[0] = v; data[b.key] = ''; t.value = ''; grow(t); persist();
            msg.textContent = 'Added to the “Ask the client” column of your running list (Step 4).';
          });
          row.appendChild(btn); row.appendChild(msg); w.appendChild(t); w.appendChild(row); s.appendChild(w);
        })();
        break;
      case 'objmaker': s.className = 'blk'; s.appendChild(objMaker(b)); break;
      case 'callout':
        s.className = 'blk callout tone-' + b.tone; paras(b.paras, s); break;
      case 'plain': s.className = 'blk plain'; s.appendChild(el('p', 'para', b.text)); break;
      case 'list':
        s.className = 'blk callout tone-gray'; s.appendChild(el('div', 'ctitle', b.title));
        var ul = el('ul'); b.items.forEach(function (i) { ul.appendChild(el('li', null, i)); }); s.appendChild(ul); break;
      case 'compare':
        s.className = 'blk compare'; s.appendChild(el('div', 'ctitle', b.title));
        var g = el('div', 'cmp'); g.appendChild(el('div', 'cmpbox', b.left)); g.appendChild(el('div', 'cmpbox better', b.right)); s.appendChild(g);
        s.appendChild(el('p', 'para', b.why)); break;
    }
    return s;
  }

  /* ---------- views ---------- */
  var views = [{ id: 'start', title: 'Start here', kind: 'start' }];
  var stepNo = 0;
  C.phases.forEach(function (ph) {
    ph.steps.forEach(function (st) { stepNo++; views.push({ id: 'step-' + stepNo, title: st.title, kind: 'step', step: st, n: stepNo, phase: ph.name }); });
  });
  views.push({ id: 'ai-log', title: C.aiLog.title, kind: 'log' });
  views.push({ id: 'save', title: 'Save and export', kind: 'save' });
  var TOTAL = stepNo;

  var main = document.getElementById('main');

  function viewIntro() {
    var f = document.createDocumentFragment();
    f.appendChild(el('h1', null, C.title));
    f.appendChild(el('p', 'lead', C.intro));
    C.paras.forEach(function (p) { f.appendChild(el('p', 'para', p)); });
    var note = el('div', 'callout tone-blue'); note.appendChild(el('p', 'para', C.note)); f.appendChild(note);
    f.appendChild(el('h2', null, 'How this guide works'));
    f.appendChild(el('p', 'para', C.howto));
    var key = el('div', 'keylist');
    C.key.forEach(function (k) {
      var r = el('div', 'keyrow'); var l = el('div', 'lab'); l.appendChild(icon(k.icon)); l.appendChild(el('span', null, k.label));
      r.appendChild(l); r.appendChild(el('div', 'keytext', k.text)); key.appendChild(r);
    });
    f.appendChild(key);
    C.howtoNote.forEach(function (p) { f.appendChild(el('p', 'para', p)); });
    var warn = el('div', 'callout tone-red');
    warn.appendChild(el('p', 'para', 'Do not type confidential client information into this page. Your notes are kept in this browser on this device only.'));
    f.appendChild(warn);
    var go = el('button', 'btn primary', 'Begin Step 1'); go.type = 'button'; go.addEventListener('click', function () { goto('step-1'); });
    f.appendChild(go);
    return f;
  }
  function viewStep(v) {
    var f = document.createDocumentFragment();
    f.appendChild(el('div', 'eyebrow', 'Phase: ' + v.phase + '  ·  Step ' + v.n + ' of ' + TOTAL));
    f.appendChild(el('h1', null, v.step.title));
    f.appendChild(el('p', 'lead', v.step.purpose));
    v.step.blocks.forEach(function (b) { f.appendChild(block(b, v.step)); });
    var nxt = views[views.indexOf(v) + 1];
    if (nxt && nxt.kind === 'step' && nxt.phase !== v.phase || v.n === TOTAL) {
      var rm = el('div', 'callout tone-blue'); var rp = el('p', 'para');
      rp.appendChild(document.createTextNode('End of the ' + v.phase + ' phase. '));
      var ra = el('a', 'inlinelink', 'Save a backup of your notes now.'); ra.href = '#save'; rp.appendChild(ra); rm.appendChild(rp); f.appendChild(rm);
    }
    if (v.n === TOTAL) { var c = el('div', 'callout tone-gray'); c.appendChild(el('p', 'para', C.closing)); f.appendChild(c); }
    return f;
  }
  function viewLog() {
    var f = document.createDocumentFragment();
    f.appendChild(el('h1', null, C.aiLog.title)); f.appendChild(el('p', 'lead', C.aiLog.sub));
    f.appendChild(table({ key: C.aiLog.key, label: 'Log', cols: C.aiLog.cols, rows: 3, wide: true }));
    return f;
  }
  function viewSave() {
    var f = document.createDocumentFragment();
    f.appendChild(el('h1', null, 'Save and export'));
    f.appendChild(el('p', 'lead', 'Your notes save automatically in this browser. Use these buttons to keep a copy outside it.'));
    var box = el('div', 'actions');
    var w = el('button', 'btn primary', 'Download my notes as a Word document'); w.type = 'button'; w.id = 'btnWord';
    var c = el('button', 'btn', 'Copy all my notes'); c.type = 'button';
    box.appendChild(w); box.appendChild(c); f.appendChild(box);
    var msg = el('p', 'para msg'); msg.setAttribute('role', 'status'); f.appendChild(msg);
    function notes() { return exporter.collectNotes(C, data); }
    c.addEventListener('click', function () {
      var txt = exporter.notesToText(C.title, notes());
      function ok() { msg.textContent = 'Copied. Paste it into a document.'; }
      function fb() { ta.hidden = false; ta.value = txt; ta.select(); msg.textContent = 'Select all of the text in the box below and copy it.'; }
      try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (e) { fb(); }
    });
    w.addEventListener('click', function () {
      var n = notes();
      if (!n.length) { msg.textContent = 'There is nothing to export yet.'; return; }
      if (!window.docx) { msg.textContent = 'The Word export could not load. Use “Copy all my notes” instead.'; return; }
      var doc = exporter.buildDocx(window.docx, C.title, n);
      window.docx.Packer.toBlob(doc).then(function (blob) {
        return saveFile('My notes - Client Project Guide.docx', blob).then(function () { msg.textContent = 'Your Word document should be in your downloads.'; });
      }).catch(function (e) { msg.textContent = (e && e.code === 'declined') ? 'Download cancelled.' : 'The download did not work. Use \u201cCopy all my notes\u201d instead.'; });
    });
    var ta = el('textarea', 'inp big'); ta.id = 'copybox'; ta.hidden = true; ta.readOnly = true; ta.setAttribute('aria-label', 'All my notes'); f.appendChild(ta);

    f.appendChild(el('h2', null, 'Back up your notes'));
    f.appendChild(el('p', 'para', 'Your notes live in this browser on this device. If you switch devices or browsers, or clear your browser data, they will not be there. Save a backup file now and then, and keep it in your Google Drive. You can load it back on any device.'));
    var bkrow = el('div', 'actions');
    var bsave = el('button', 'btn primary', 'Save a backup file'); bsave.type = 'button';
    var brest = el('label', 'btn', 'Restore from a backup file'); brest.setAttribute('for', 'restorefile');
    var rin = document.createElement('input'); rin.type = 'file'; rin.id = 'restorefile'; rin.accept = '.json,application/json'; rin.className = 'visually-hidden';
    brest.appendChild(rin); bkrow.appendChild(bsave); bkrow.appendChild(brest); f.appendChild(bkrow);
    var bmsg = el('p', 'para msg'); bmsg.setAttribute('role', 'status'); f.appendChild(bmsg);
    var rconf = el('div', 'callout tone-red'); rconf.hidden = true;
    var pending = null;
    rconf.appendChild(el('p', 'para', 'This replaces the notes in this browser with the notes in the backup file. Notes you have written since that backup will be lost.'));
    var rrow = el('div', 'actions'); var ryes = el('button', 'btn danger', 'Yes, replace my notes'); ryes.type = 'button';
    var rno = el('button', 'btn', 'Cancel'); rno.type = 'button'; rrow.appendChild(ryes); rrow.appendChild(rno); rconf.appendChild(rrow); f.appendChild(rconf);
    bsave.addEventListener('click', function () {
      var payload = JSON.stringify({ app: 'client-project-guide', version: 1, saved: new Date().toISOString(), data: data }, null, 2);
      saveFile('Client Guide backup.json', new Blob([payload], { type: 'application/json' }))
        .then(function () { bmsg.textContent = 'Your backup file should be in your downloads. Move it to your Google Drive.'; })
        .catch(function (e) { bmsg.textContent = (e && e.code === 'declined') ? 'Download cancelled.' : 'The backup did not save. Use \u201cCopy all my notes\u201d instead.'; });
    });
    rin.addEventListener('change', function () {
      var file = rin.files && rin.files[0]; if (!file) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var obj = JSON.parse(rd.result);
          if (!obj || obj.app !== 'client-project-guide' || !obj.data || typeof obj.data !== 'object') throw new Error('bad');
          pending = obj.data; rconf.hidden = false; bmsg.textContent = 'Backup file read. Confirm below to load it.';
        } catch (e) { pending = null; rconf.hidden = true; bmsg.textContent = 'That file is not a backup from this guide.'; }
        rin.value = '';
      };
      rd.onerror = function () { bmsg.textContent = 'The file could not be read.'; };
      rd.readAsText(file);
    });
    ryes.addEventListener('click', function () { if (pending) { data = pending; pending = null; persist(); updateNav(); bmsg.textContent = 'Your notes were restored. Look through the steps to see them.'; } rconf.hidden = true; });
    rno.addEventListener('click', function () { pending = null; rconf.hidden = true; bmsg.textContent = 'Nothing was changed.'; });

    f.appendChild(el('h2', null, 'Test tools'));
    f.appendChild(el('p', 'para', 'This test version has no sign-in. These buttons help you try every feature.'));
    var t = el('div', 'actions');
    var samp = el('button', 'btn', 'Fill with sample notes'); samp.type = 'button';
    var del = el('button', 'btn danger', 'Delete all my notes'); del.type = 'button';
    t.appendChild(samp); t.appendChild(del); f.appendChild(t);
    var conf = el('div', 'callout tone-red'); conf.hidden = true;
    conf.appendChild(el('p', 'para', 'This deletes every note and every checkmark in this browser. You cannot undo it.'));
    var row = el('div', 'actions'); var yes = el('button', 'btn danger', 'Yes, delete everything'); yes.type = 'button';
    var no = el('button', 'btn', 'Cancel'); no.type = 'button'; row.appendChild(yes); row.appendChild(no); conf.appendChild(row); f.appendChild(conf);
    samp.addEventListener('click', function () {
      data = JSON.parse(JSON.stringify(SAMPLE)); persist(); msg.textContent = 'Sample notes added (a made-up example, not a real client). Look through the steps.'; updateNav();
    });
    del.addEventListener('click', function () { conf.hidden = false; });
    no.addEventListener('click', function () { conf.hidden = true; });
    yes.addEventListener('click', function () { data = {}; persist(); conf.hidden = true; msg.textContent = 'All notes deleted.'; updateNav(); });
    return f;
  }

  /* ---------- nav ---------- */
  var nav = document.getElementById('navlist');
  var navBtns = {};
  function buildNav() {
    nav.innerHTML = '';
    function item(v, extra) {
      var li = el('li'); var a = el('a', 'navitem'); a.href = '#' + v.id;
      var dot = el('span', 'dot'); a.appendChild(dot);
      a.appendChild(el('span', 'navtext', extra || v.title)); li.appendChild(a); nav.appendChild(li); navBtns[v.id] = { a: a, dot: dot, v: v };
    }
    item(views[0]);
    var n = 0;
    C.phases.forEach(function (ph) {
      var h = el('li', 'navphase', ph.name); nav.appendChild(h);
      ph.steps.forEach(function (st) { n++; item(views[n], st.title.replace(/^Step \d+\.\s*/, '')); navBtns['step-' + n].dot.textContent = String(n); });
    });
    var h2 = el('li', 'navphase', 'Tools'); nav.appendChild(h2);
    var rl = el('li'); var ra = el('a', 'navitem'); ra.href = '#running-list'; ra.appendChild(el('span', 'dot', '·')); ra.appendChild(el('span', 'navtext', 'Running list')); rl.appendChild(ra); nav.appendChild(rl);
    item(views[views.length - 2], 'AI and Tools Log');
    item(views[views.length - 1]);
  }
  function updateNav() {
    var done = 0;
    for (var i = 1; i <= TOTAL; i++) {
      var k = C.phases.reduce(function (a, p) { return a.concat(p.steps); }, [])[i - 1].doneKey;
      var b = navBtns['step-' + i]; var d = !!data[k];
      if (d) done++;
      b.a.classList.toggle('isdone', d);
    }
    document.getElementById('progtext').textContent = done + ' of ' + TOTAL + ' steps done';
    document.getElementById('progfill').style.width = (done / TOTAL * 100) + '%';
    document.getElementById('progbar').setAttribute('aria-valuenow', String(done));
  }

  var currentId = null;
  function goto(id) { if (location.hash === '#' + id) show(); else location.hash = id; }
  function show() {
    var h = (location.hash || '').replace('#', '');
    var anchor = null;
    if (h === 'running-list') { anchor = h; h = 'step-4'; }
    var v = views.filter(function (x) { return x.id === h; })[0] || views[0];
    updaters = []; fieldEls = []; tableEls = [];
    main.innerHTML = '';
    var wrap = el('div', 'page');
    wrap.appendChild(v.kind === 'start' ? viewIntro() : v.kind === 'step' ? viewStep(v) : v.kind === 'log' ? viewLog() : viewSave());
    // prev / next
    var i = views.indexOf(v), pn = el('div', 'pn');
    if (i > 0) { var p = el('a', 'btn', '‹ Back'); p.href = '#' + views[i - 1].id; pn.appendChild(p); } else pn.appendChild(el('span'));
    if (i < views.length - 1) { var n = el('a', 'btn primary', i === 0 ? 'Begin Step 1 ›' : 'Next ›'); n.href = '#' + views[i + 1].id; pn.appendChild(n); }
    wrap.appendChild(pn);
    main.appendChild(wrap);
    Object.keys(navBtns).forEach(function (k) { navBtns[k].a.classList.toggle('current', k === v.id && !anchor); });
    document.body.classList.remove('navopen');
    setTimeout(function () { main.querySelectorAll('textarea.inp, textarea.cell').forEach(grow); }, 0);
    if (anchor) { var t = document.getElementById(anchor); if (t) t.scrollIntoView(); } else window.scrollTo(0, 0);
    currentId = v.id;
  }

  /* ---------- boot ---------- */
  var exporter = { collectNotes: collectNotes, notesToText: notesToText, buildDocx: buildDocx };
  load(); buildNav(); updateNav();
  window.addEventListener('hashchange', show);
  document.getElementById('menubtn').addEventListener('click', function () { document.body.classList.toggle('navopen'); });
  document.getElementById('scrim').addEventListener('click', function () { document.body.classList.remove('navopen'); });
  show();
  if (memOnly) setStatus('Not saved: this browser blocks storage. Copy your notes before leaving.');
  var tgl = document.getElementById('themebtn');
  tgl.addEventListener('click', function () {
    var root = document.documentElement, cur = root.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
})();

</script>
